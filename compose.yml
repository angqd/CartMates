services:
  cartmates:
    build: .
    env_file: .env
    volumes:
      - ./data:/data
    restart: unless-stopped
    depends_on: [phoenix]
  phoenix:
    image: arizephoenix/phoenix:version-20.24.0
    ports:
      - "6007:6006"
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
    volumes:
      - phoenix-data:/mnt/data
    restart: unless-stopped

volumes:
  phoenix-data:
